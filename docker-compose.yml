services:
  lab-dental-db:
    image: postgres:15-alpine
    container_name: lab-dental-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: lab_dental
      POSTGRES_USER: lab_dental
      # POSTGRES_PASSWORD viene de .env
    volumes:
      - lab_dental_db_data:/var/lib/postgresql/data
    # Puerto solo accesible desde el propio VPS (127.0.0.1), no expuesto a internet.
    # Útil para conectar Prisma Studio via túnel SSH si algún día lo necesitas.
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_dental -d lab_dental"]
      interval: 10s
      timeout: 5s
      retries: 5

  lab-dental-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-dental-app
    restart: unless-stopped
    depends_on:
      lab-dental-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://lab_dental:${POSTGRES_PASSWORD}@lab-dental-db:5432/lab_dental?schema=public"
      NEXTAUTH_URL: "https://odontologia.clicknube.site"
      # NEXTAUTH_SECRET viene de .env
    volumes:
      - lab_dental_uploads:/app/public/uploads
    expose:
      - "3000"
    networks:
      - default
      - proxy-network

volumes:
  lab_dental_db_data:
  lab_dental_uploads:

networks:
  proxy-network:
    external: true
